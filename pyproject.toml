[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etflab"
version = "1.0.0"
description = "A reproducible research harness for ETF replication: offline-first data, a strategy horse race with statistical inference, and overfitting diagnostics."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "khuper" }]
keywords = ["quantitative-finance", "portfolio-optimization", "backtesting", "reproducible-research", "etf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "cvxpy>=1.5",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "rich>=13.7",
]

[project.optional-dependencies]
live = ["yfinance>=0.2.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "types-setuptools"]

[project.urls]
Homepage = "https://github.com/khuper/etf-replication-demo"
Issues = "https://github.com/khuper/etf-replication-demo/issues"

[project.scripts]
etf-lab = "etflab.cli:main"

[tool.setuptools.packages.find]
include = ["etflab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: simulation studies that take more than a few seconds",
]
filterwarnings = [
  "error::DeprecationWarning:etflab.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "W",     # pycodestyle + pyflakes
  "I",               # import sorting
  "UP",              # pyupgrade
  "B",               # bugbear
  "SIM",             # simplifications
  "RUF",             # ruff-specific
  "NPY",             # numpy legacy random, etc.
  "PD",              # pandas anti-patterns
]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # argparse and dataclass defaults legitimately call functions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "PD901", "SIM117"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["etflab"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["cvxpy.*", "yfinance.*", "matplotlib.*", "scipy.*"]
ignore_missing_imports = true
