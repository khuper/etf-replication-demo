[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-replicator"
version = "1.0.0"
description = "Replicate an illiquid target ETF with a liquid basket via constrained tracking-error optimization"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "cvxpy>=1.4",
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.scripts]
etf-replicate = "etf_replicator.cli:replicate_main"
etf-correlations = "etf_replicator.cli:correlations_main"

[tool.setuptools.packages.find]
where = ["src"]
