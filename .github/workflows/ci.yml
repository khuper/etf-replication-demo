name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check etflab tests
      - run: ruff format --check etflab tests
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run the suite
        # No network is available or required: the default data source is generated.
        run: pytest -q --cov=etflab --cov-report=term-missing

  research:
    name: Research pipeline end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .

      - name: Run the shipped experiment
        run: etf-lab study --output outputs

      - name: Verify the result reproduces
        # Re-runs the whole experiment in a fresh process and compares the results
        # digest against the stored manifest. This is the reproducibility claim as
        # a test, and it doubles as the cross-process determinism check: anything
        # that leaked a wall clock, an unseeded generator or a dict-ordering
        # dependency into a research result shows up here as a changed digest.
        run: |
          RUN_DIR=$(python -c "from etflab.registry import RunRegistry; print(RunRegistry('outputs').latest().run_dir)")
          echo "Verifying $RUN_DIR"
          etf-lab verify "$RUN_DIR"

      - name: Upload the research artefacts
        uses: actions/upload-artifact@v4
        with:
          name: research-run
          path: outputs/
          retention-days: 30

  docs:
    name: Documentation is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Check the README quotes the numbers the code actually produces
        run: python scripts/build_docs.py --check
